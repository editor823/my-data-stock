name: Live Stock News Auto Update (네이버 증시 뉴스 100건 및 실시간 주도 테마 자동 동기화)

on:
  schedule:
    # 한국 시간 기준: 
    # 08:30 (장시작 전) -> UTC 23:30 (전일)
    # 12:30 (장중 점심) -> UTC 03:30
    # 16:30 (장마감 후) -> UTC 07:30
    # 21:00 (야간 종합) -> UTC 12:00
    - cron: '30 23,3,7,12 * * *'
  workflow_dispatch: # 수동 즉시 실행 지원

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 1. 최신 증시 뉴스 100건 수집 및 시드 갱신
        continue-on-error: true
        run: node scripts/update_live_domestic_news.js

      - name: 2. 당일 시장 판도 및 주도 테마 레이더 데이터 수집 및 갱신
        continue-on-error: true
        run: node scripts/update_market_overview_radar.js

      - name: 3. 심플 관심종목 TV 최신 영상 브리핑 데이터 수집
        continue-on-error: true
        run: node scripts/update_simple_channel_briefing.js

      - name: Python 환경 설정
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. 미국 섹터 브리핑 데이터 수집 및 갱신
        continue-on-error: true
        run: |
          pip install requests beautifulsoup4 yfinance
          python scripts/fetch_us_sector.py

      - name: 5. 텔레그램 주식 브리핑 자동 발송
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/send_telegram_report.js report

      - name: 6. 변경사항 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/ data/ js/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update live domestic news, US sector, market radar & YouTube briefing [skip ci]" && git push)
